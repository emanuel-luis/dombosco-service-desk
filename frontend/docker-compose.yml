version: '3'

services:
  db:
    image: mariadb
    container_name: facul_db
    ports:
      - 3306:3306
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ""
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: facul 
    networks:
      - facul_network
  app:
    build: 
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 3000:3000
      - 9229:9229
    container_name: 'facul_dev'
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    networks:
      - facul_network
    depends_on: 
      - db
networks:
  facul_network:
    name: facul_network
    driver: bridge
volumes:
  node_modules:
    driver: local
    driver_opts:
      type: auto
      o: bind
      device: ./node_modules
