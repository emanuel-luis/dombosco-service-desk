[project]
name = "dombosco-service-desk-api"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django~=5.2",
    "djangorestframework~=3.16",
    "djangorestframework-simplejwt~=5.5",
    "dj-rest-auth[with_social]~=7.0",
    "django-allauth~=65.0",
    "psycopg[binary]~=3.3",
    "drf-spectacular",
    "django-cors-headers",
    "whitenoise",
    "gunicorn",
    "dj-database-url",
    "pydantic-settings",
    "pyyaml",
]

[project.optional-dependencies]
export = [  # Parquet export (manage.py export_analytics)
    "pyarrow>=18",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
    "pytest-timeout",
    "pytest-env",
    "mypy>=2.4.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "BLE", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dombosco_service_desk.settings"
addopts = "-ra --strict-markers --strict-config"
timeout = 60
filterwarnings = ["ignore:No directory at.*staticfiles:UserWarning"]
testpaths = ["tests"]
markers = ["postgres: needs a PostgreSQL database (skipped on SQLite)"]
env = [
    "D:SECRET_KEY=test-only-not-secret-0123456789abcdef",
    "D:DATABASE_URL=sqlite://:memory:",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "dombosco_service_desk.settings"

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["allauth.*", "dj_rest_auth.*", "corsheaders.*", "drf_spectacular.*", "dj_database_url.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test helpers are untyped, so calling them from typed tests would otherwise fail.
module = "tests.*"
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
