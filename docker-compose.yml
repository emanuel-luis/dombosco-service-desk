version: '3.7'
services:
  backend:
    build: ./backend
    command: python manage.py runserver $BACKEND_HOST:$BACKEND_PORT
    ports:
      - 8000:8000
    environment:
      - DEPLOYMENT=dev
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    networks:
      - pgsql-network
      - web-network
  frontend:
    build: ./frontend
    command: npm run dev -- -p $FRONTEND_PORT -H $FRONTEND_HOST
    ports:
      - 3000:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    networks:
      - web-network
  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=hello_world@20241109
      - POSTGRES_DB=dom_bosco
    ports:
      - 5432
    networks:
      - pgsql-network
    volumes:
      - postgres_data:/var/lib/postgresql/data/

networks:
  pgsql-network:
    driver: bridge
  web-network:
    driver: bridge

volumes:
  postgres_data: